name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.x
  DOTNET_NOLOGO: true

jobs:
  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build GodMorningApp.slnx --configuration Release

  staging:
    name: Staging
    needs: sandbox
    runs-on: ubuntu-latest
    # Waits for approval: the "staging" environment has required reviewers.
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build GodMorningApp.slnx --configuration Release

  production:
    name: Production
    needs: staging
    runs-on: ubuntu-latest
    # Waits for approval: the "production" environment has required reviewers.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build GodMorningApp.slnx --configuration Release
